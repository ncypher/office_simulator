<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Hours · The meeting room</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;color:#edf0ff;background:#15192d}
#stage{height:460px;position:relative;overflow:hidden;border:1px solid #424061;border-radius:20px;background:radial-gradient(ellipse at 30% 20%,#49346b,#242b48 55%,#162e38)}
canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:18px;left:18px;right:105px;pointer-events:none}
.pill{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#191c32ec;border:1px solid #555171;border-radius:30px;padding:7px 12px;font-size:12px;letter-spacing:.06em;font-weight:700;color:#d8ceff}
#home,.playback button{border:1px solid #555171;background:#252840;border-radius:20px;padding:7px 12px;color:#edf0ff;cursor:pointer;font:inherit;font-size:13px}
#home{position:absolute;top:17px;right:17px}button:hover{background:#49415f!important}button:focus-visible{outline:3px solid #c7b7ff;outline-offset:2px}button:disabled{opacity:.45;cursor:default}
.playback{display:flex;align-items:center;gap:8px;margin-top:10px}.playback span{font-size:12px;color:#b8bdd7;margin-left:auto}
#bubble{position:absolute;bottom:14px;left:14px;right:14px;border:1px solid #555171;background:#191c32f5;border-radius:14px;padding:12px 16px;box-shadow:0 5px 24px #0004;max-height:170px;overflow:auto;pointer-events:auto}
#bubble strong{font-size:14px;filter:brightness(1.4)}#quote{margin-top:4px;font-size:14px}.tag{position:absolute;transform:translate(-50%,-50%);background:#20243aee;color:#f1efff;border-radius:20px;padding:5px 10px;white-space:nowrap;font-size:12px;pointer-events:none;border:2px solid transparent}
#error{position:absolute;inset:100px 25px auto;background:#20243a;padding:20px;border-radius:16px;display:none}
@media(max-width:480px){#stage{height:370px}#bubble{bottom:10px;left:10px;right:10px}.tag{font-size:12px}#hud{left:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="stage" role="img" aria-label="Interactive miniature office with three characters around a meeting table">
<div id="hud"><span class="pill" id="room">CONFERENCE ROOM 01</span></div>
<button id="home" aria-label="Reset camera view">Home ↺</button>
<div id="bubble"><div aria-live="polite"><strong id="speaker">The room is yours.</strong><div id="quote">Three coffees. One conversation waiting to happen.</div></div><div class="playback"><button id="replay" disabled>Replay last turns</button><button id="pause" disabled>Pause</button><span id="beat">Waiting for a turn</span></div></div>
<div id="error">The 3D view couldn’t start on this device. You can still play using the conversation controls.</div>
</div>
<script type="module" src="./scene.js"></script></body></html>
