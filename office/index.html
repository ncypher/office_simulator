<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Hours · The meeting room</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;color:#303550;background:#e8ecf7}
#stage{height:430px;position:relative;overflow:hidden;border-radius:20px;background:radial-gradient(ellipse at 50% 30%,#f2f5ff,#dce3f2)}
canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:18px;left:18px;pointer-events:none}
.pill{display:inline-block;background:#ffffffdf;border:1px solid #fff;border-radius:30px;padding:7px 12px;font-size:12px;letter-spacing:.06em;font-weight:700}
#home{position:absolute;top:17px;right:17px;border:1px solid #fff;background:#ffffffdf;border-radius:20px;padding:8px 13px;color:#303550;cursor:pointer;font:inherit;font-size:13px}
#bubble{position:absolute;bottom:18px;left:18px;right:18px;border:1px solid #fff;background:#fffffff2;border-radius:14px;padding:12px 16px;box-shadow:0 5px 24px #30355010;max-height:118px;overflow:auto;pointer-events:auto}
#bubble strong{font-size:13px}#quote{margin-top:4px;font-size:14px}.tag{position:absolute;transform:translate(-50%,-50%);background:#ffffffed;border-radius:20px;padding:5px 10px;white-space:nowrap;font-size:12px;pointer-events:none;border:2px solid transparent}
#error{position:absolute;inset:100px 25px auto;background:white;padding:20px;border-radius:16px;display:none}
@media(max-width:480px){#stage{height:370px}#bubble{bottom:10px;left:10px;right:10px}.tag{font-size:12px}#hud{left:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<div id="stage" role="img" aria-label="Interactive miniature office with three characters around a meeting table">
<div id="hud"><span class="pill" id="room">CONFERENCE ROOM 01</span></div>
<button id="home" aria-label="Reset camera view">Home ↺</button>
<div id="bubble" aria-live="polite"><strong id="speaker">The room is yours.</strong><div id="quote">Three coffees. One conversation waiting to happen.</div></div>
<div id="error">The 3D view couldn’t start on this device. You can still play using the conversation controls.</div>
</div>
<script type="module" src="./scene.js"></script></body></html>
